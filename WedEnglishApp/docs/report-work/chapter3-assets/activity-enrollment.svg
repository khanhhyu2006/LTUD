<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1900"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3f5669"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,'Segoe UI',sans-serif;fill:#172b3a}.line{fill:none;stroke:#3f5669;stroke-width:2;marker-end:url(#arr)}.dash{stroke-dasharray:8 6}rect.box{fill:white;stroke:#3f5669;stroke-width:2}</style><text x="800" y="42" font-size="34" text-anchor="middle">Biểu đồ hoạt động quy trình đăng ký khóa học</text><rect x="15" y="65" width="520" height="1785" fill="none" stroke="#b1bcc6"/><text x="275" y="105" font-size="29" text-anchor="middle">Học viên</text><rect x="545" y="65" width="520" height="1785" fill="none" stroke="#b1bcc6"/><text x="805" y="105" font-size="29" text-anchor="middle">Hệ thống</text><rect x="1075" y="65" width="520" height="1785" fill="none" stroke="#b1bcc6"/><text x="1335" y="105" font-size="29" text-anchor="middle">Admin</text><circle cx="275" cy="150" r="13" fill="#172b3a"/><rect class="box" x="75" y="205" width="400" height="88" rx="8"/><text x="275" y="242" font-size="25" text-anchor="middle">Tra cứu, chọn khóa học</text><text x="275" y="272" font-size="25" text-anchor="middle">và đăng nhập tài khoản</text><path class="line" d="M275 163V205"/><rect class="box" x="75" y="350" width="400" height="110" rx="8"/><text x="275" y="383" font-size="25" text-anchor="middle">Nhập ngày có thể bắt đầu</text><text x="275" y="413" font-size="25" text-anchor="middle">buổi, 246 / 357, ghi chú</text><text x="275" y="443" font-size="25" text-anchor="middle">và cách đóng học phí</text><path class="line" d="M275 293V350"/><rect class="box" x="605" y="350" width="390" height="110" rx="8"/><text x="800" y="398" font-size="25" text-anchor="middle">Kiểm tra dữ liệu đầu vào</text><text x="800" y="428" font-size="25" text-anchor="middle">và đơn đăng ký trùng</text><path class="line" d="M475 405H605"/><path d="M800 520L905 580L800 640L695 580Z" fill="white" stroke="#3f5669" stroke-width="2"/><text x="800" y="588" font-size="25" text-anchor="middle">Hợp lệ?</text><path class="line" d="M800 460V520"/><rect class="box" x="85" y="535" width="380" height="88" rx="8"/><text x="275" y="587" font-size="25" text-anchor="middle">Nhận lỗi và sửa biểu mẫu</text><path class="line" d="M695 580H465"/><text x="510" y="565" font-size="23" text-anchor="start">Không</text><path class="line" d="M275 535V460"/><rect class="box" x="595" y="705" width="410" height="135" rx="8"/><text x="800" y="735.5" font-size="25" text-anchor="middle">Mở transaction</text><text x="800" y="765.5" font-size="25" text-anchor="middle">Lưu Registration Pending</text><text x="800" y="795.5" font-size="25" text-anchor="middle">ClassId = NULL</text><text x="800" y="825.5" font-size="25" text-anchor="middle">và Payment Pending</text><path class="line" d="M800 640V705"/><text x="817" y="680" font-size="23" text-anchor="start">Có</text><rect class="box" x="595" y="900" width="410" height="95" rx="8"/><text x="800" y="940.5" font-size="25" text-anchor="middle">Commit và trả trang</text><text x="800" y="970.5" font-size="25" text-anchor="middle">hướng dẫn đóng học phí</text><path class="line" d="M800 840V900"/><rect class="box" x="1110" y="1070" width="405" height="105" rx="8"/><text x="1312.5" y="1115.5" font-size="25" text-anchor="middle">Nhận đơn và nguyện vọng</text><text x="1312.5" y="1145.5" font-size="25" text-anchor="middle">Tìm lớp cùng khóa học</text><path class="line" d="M1005 950H1040V1120H1110"/><rect class="box" x="1110" y="1230" width="405" height="115" rx="8"/><text x="1312.5" y="1280.5" font-size="25" text-anchor="middle">Kiểm tra ngày khai giảng</text><text x="1312.5" y="1310.5" font-size="25" text-anchor="middle">sĩ số và lịch trùng thực tế</text><path class="line" d="M1310 1175V1230"/><path d="M1310 1395L1435 1455L1310 1515L1185 1455Z" fill="white" stroke="#3f5669" stroke-width="2"/><text x="1310" y="1463" font-size="25" text-anchor="middle">Phù hợp?</text><path class="line" d="M1310 1345V1395"/><path class="line" d="M1435 1455H1550V1120H1515"/><text x="1370" y="1380" font-size="23" text-anchor="start">Không: giữ chờ</text><rect class="box" x="1100" y="1580" width="420" height="95" rx="8"/><text x="1310" y="1620.5" font-size="25" text-anchor="middle">Gán ClassId và Confirmed</text><text x="1310" y="1650.5" font-size="25" text-anchor="middle">Công bố lớp, lịch học</text><path class="line" d="M1310 1515V1580"/><text x="1327" y="1550" font-size="23" text-anchor="start">Có</text><rect class="box" x="85" y="1580" width="380" height="95" rx="8"/><text x="275" y="1620.5" font-size="25" text-anchor="middle">Xem lớp và thời khóa biểu</text><text x="275" y="1650.5" font-size="25" text-anchor="middle">trong tài khoản</text><path class="line" d="M1100 1625H465"/><circle cx="275" cy="1760" r="19" fill="none" stroke="#172b3a" stroke-width="3"/><circle cx="275" cy="1760" r="12" fill="#172b3a"/><path class="line" d="M275 1675V1740"/><text x="800" y="1880" font-size="24" text-anchor="middle">Xác nhận thu học phí được xử lý riêng; buổi và nhóm thứ là nguyện vọng để Admin cân nhắc.</text></svg>