<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1670"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3f5669"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,'Segoe UI',sans-serif;fill:#172b3a}.line{fill:none;stroke:#3f5669;stroke-width:2;marker-end:url(#arr)}.dash{stroke-dasharray:8 6}rect.box{fill:white;stroke:#3f5669;stroke-width:2}</style><text x="900" y="40" font-size="34" text-anchor="middle">Biểu đồ tuần tự đối soát và xác nhận học phí</text><rect class="box" x="15" y="80" width="230" height="76" rx="8"/><text x="130" y="126" font-size="25" text-anchor="middle">Học viên</text><path d="M130 156V1570" fill="none" stroke="#82909a" stroke-dasharray="9 7"/><rect class="box" x="325" y="80" width="230" height="76" rx="8"/><text x="440" y="126" font-size="25" text-anchor="middle">Razor View</text><path d="M440 156V1570" fill="none" stroke="#82909a" stroke-dasharray="9 7"/><rect class="box" x="735" y="80" width="230" height="76" rx="8"/><text x="850" y="126" font-size="25" text-anchor="middle">Controllers</text><path d="M850 156V1570" fill="none" stroke="#82909a" stroke-dasharray="9 7"/><rect class="box" x="1105" y="80" width="230" height="76" rx="8"/><text x="1220" y="111" font-size="25" text-anchor="middle">EF Core</text><text x="1220" y="141" font-size="25" text-anchor="middle">SQL Server</text><path d="M1220 156V1570" fill="none" stroke="#82909a" stroke-dasharray="9 7"/><rect class="box" x="1525" y="80" width="230" height="76" rx="8"/><text x="1640" y="126" font-size="25" text-anchor="middle">Admin</text><path d="M1640 156V1570" fill="none" stroke="#82909a" stroke-dasharray="9 7"/><path class="line " d="M130 220H440"/><text x="285" y="206" font-size="22" text-anchor="middle">1. Gửi đăng ký + cách đóng học phí</text><path class="line " d="M440 305H850"/><text x="645" y="291" font-size="22" text-anchor="middle">2. POST Enrollment/Confirm</text><path class="line " d="M850 390H1220"/><text x="1035" y="376" font-size="22" text-anchor="middle">3. Transaction: Registration + Payment Pending</text><path class="line dash" d="M1220 475H850"/><text x="1035" y="461" font-size="22" text-anchor="middle">4. Commit; RegistrationId và mã HPREG</text><path class="line dash" d="M850 560H440"/><text x="645" y="546" font-size="22" text-anchor="middle">5. Redirect Enrollment/Payment</text><path class="line dash" d="M440 645H130"/><text x="285" y="631" font-size="22" text-anchor="middle">6. Hiển thị QR / hướng dẫn nộp tiền</text><rect x="40" y="705" width="1710" height="130" fill="#f4f6f8" stroke="#82909a"/><text x="895" y="755" font-size="25" text-anchor="middle">Học viên thanh toán ngoài hệ thống bằng ứng dụng ngân hàng hoặc tại quầy.</text><text x="895" y="795" font-size="25" text-anchor="middle">Không có callback ngân hàng tự động; hiển thị QR không làm Payment chuyển Paid.</text><path class="line " d="M1640 900H850"/><text x="1245" y="886" font-size="22" text-anchor="middle">7. Mở danh sách và kiểm tra chứng từ</text><path class="line " d="M850 985H1220"/><text x="1035" y="971" font-size="22" text-anchor="middle">8. Đọc Payment và Registration</text><path class="line dash" d="M1220 1070H850"/><text x="1035" y="1056" font-size="22" text-anchor="middle">9. Trả thông tin học phí</text><path class="line " d="M1640 1155H850"/><text x="1245" y="1141" font-size="22" text-anchor="middle">10. POST PaymentAdmin/ConfirmPayment</text><path class="line " d="M850 1240H1220"/><text x="1035" y="1226" font-size="22" text-anchor="middle">11. Cập nhật Status = Paid; SaveChanges</text><path class="line dash" d="M1220 1325H850"/><text x="1035" y="1311" font-size="22" text-anchor="middle">12. Lưu thành công</text><path class="line dash" d="M850 1410H1640"/><text x="1245" y="1396" font-size="22" text-anchor="middle">13. Thông báo đã xác nhận thu</text><path class="line " d="M130 1495H850"/><text x="490" y="1481" font-size="22" text-anchor="middle">14. Xem lịch sử và in biên lai theo quyền sở hữu</text><text x="900" y="1630" font-size="25" text-anchor="middle">Registration Pending / Confirmed và ClassId không tự thay đổi khi xác nhận học phí.</text></svg>